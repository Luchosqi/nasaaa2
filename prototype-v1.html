<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abandoned but not Forgotten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#eaf0ff;--dim:#8fa0c8;--line:rgba(160,185,255,.25);--accent:#7fb2ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,10,.75) 100%)}
.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");animation:gr .6s steps(4) infinite}
@keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}
.mono{font-family:'Space Mono',monospace}
#brand{position:fixed;left:3vw;top:3vh;z-index:5;transition:opacity .8s}
#brand b{display:block;font-size:clamp(14px,1.6vw,20px);letter-spacing:.32em;font-weight:700}
#brand span{font-size:clamp(10px,.9vw,12px);color:var(--dim);letter-spacing:.18em}
#vr{position:fixed;right:3vw;top:3vh;z-index:6;border:1px solid var(--line);background:rgba(10,16,40,.45);backdrop-filter:blur(8px);color:var(--ink);padding:.55rem 1.1rem;font:700 13px 'Space Mono',monospace;letter-spacing:.2em;cursor:pointer;transition:.25s;border-radius:4px}
#vr:hover{border-color:var(--accent);box-shadow:0 0 24px rgba(127,178,255,.35)}
#hint{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:5;text-align:center;letter-spacing:.25em;font-size:12px;color:var(--dim);transition:opacity .8s;white-space:nowrap}
#hint i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:.8em;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.2;transform:scale(.6)}}
.rlabel{position:fixed;z-index:4;transform:translate(-50%,0);text-align:center;pointer-events:none;transition:opacity .5s,transform .3s;white-space:nowrap}
.rlabel .n{font-weight:700;font-size:clamp(11px,1.05vw,15px);letter-spacing:.14em}
.rlabel .d{font:400 clamp(9px,.8vw,11px) 'Space Mono',monospace;color:var(--dim);letter-spacing:.12em;margin-top:2px}
.rlabel.hot .n{color:#fff;text-shadow:0 0 14px var(--c)}
.rlabel.hot{transform:translate(-50%,-4px)}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .8s}
#hud.on{opacity:1}
#mtitle{position:absolute;top:3vh;left:50%;transform:translateX(-50%);text-align:center;font-size:clamp(10px,.95vw,13px);letter-spacing:.3em;color:var(--dim)}
#mtitle b{display:block;color:var(--ink);font-size:clamp(14px,1.5vw,20px);margin-top:4px;letter-spacing:.22em}
#prog{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);width:min(560px,70vw);text-align:center}
#prog .bar{height:2px;background:var(--line);position:relative;margin:10px 0}
#prog .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,transparent,var(--c,#7fb2ff));box-shadow:0 0 12px var(--c,#7fb2ff)}
#prog .fill::after{content:"";position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 14px var(--c,#7fb2ff)}
#prog .row{display:flex;justify-content:space-between;font:400 11px 'Space Mono',monospace;color:var(--dim);letter-spacing:.14em}
#prog .row b{color:var(--ink);font-weight:700}
#skip{pointer-events:auto;position:absolute;right:3vw;bottom:5vh;background:none;border:none;color:var(--dim);font:400 11px 'Space Mono',monospace;letter-spacing:.2em;cursor:pointer;border-bottom:1px solid var(--line);padding-bottom:2px}
#skip:hover{color:#fff}
#speedhint{position:absolute;left:3vw;bottom:5vh;font:400 11px 'Space Mono',monospace;color:var(--dim);letter-spacing:.2em}
.chap{position:absolute;width:min(330px,38vw);opacity:0;transition:opacity .9s,transform .9s;padding:14px 0 14px 18px;border-left:1px solid var(--c)}
.chap.R{right:3vw;padding:14px 18px 14px 0;border-left:none;border-right:1px solid var(--c);text-align:right;transform:translateX(24px)}
.chap.L{left:3vw;transform:translateX(-24px)}
.chap.on{opacity:1;transform:none}
.chap .k{font:700 11px 'Space Mono',monospace;letter-spacing:.28em;color:var(--c);text-transform:uppercase}
.chap h3{font-size:clamp(20px,2.3vw,32px);line-height:1.1;margin:8px 0 10px;font-weight:700}
.chap p{font-size:clamp(13px,1.1vw,16px);line-height:1.55;color:#c7d3f2;font-weight:300}
#card{position:fixed;left:3vw;top:50%;transform:translate(-30px,-50%);width:min(420px,40vw);z-index:6;opacity:0;pointer-events:none;transition:opacity 1s,transform 1s;background:linear-gradient(160deg,rgba(14,20,48,.72),rgba(6,9,24,.6));backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:10px;padding:26px 26px 22px;max-height:88vh;overflow:auto}
#card.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
#card .k{font:700 11px 'Space Mono',monospace;letter-spacing:.26em;color:var(--c)}
#card h2{font-size:clamp(26px,2.8vw,38px);line-height:1.05;margin:8px 0 4px}
#card .loc{color:var(--dim);font-size:14px;margin-bottom:14px}
#card .st{display:inline-flex;align-items:center;gap:8px;font:700 11px 'Space Mono',monospace;letter-spacing:.2em;padding:5px 10px;border:1px solid var(--line);border-radius:99px;margin-bottom:16px}
#card .st i{width:8px;height:8px;border-radius:50%;background:#7a86a8}
#card .st.live i{background:#5bff9c;box-shadow:0 0 10px #5bff9c;animation:pulse 1.4s infinite}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin-bottom:16px}
#card dt{color:var(--dim);font:400 11px 'Space Mono',monospace;letter-spacing:.1em;padding-top:2px;text-transform:uppercase}
#card dd{color:var(--ink)}
#card h4{font:700 11px 'Space Mono',monospace;letter-spacing:.24em;color:var(--c);margin:14px 0 6px}
#card p{font-size:14px;line-height:1.55;color:#c7d3f2;font-weight:300}
#card button{margin-top:18px;width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);padding:.8rem;font:700 12px 'Space Mono',monospace;letter-spacing:.22em;cursor:pointer;border-radius:4px;transition:.25s}
#card button:hover{border-color:var(--c);box-shadow:0 0 22px -4px var(--c)}
#toast{position:fixed;left:50%;top:12vh;transform:translate(-50%,-10px);z-index:20;background:rgba(10,16,40,.85);border:1px solid var(--accent);padding:.9rem 1.4rem;border-radius:6px;font-size:13px;letter-spacing:.08em;opacity:0;transition:.4s;pointer-events:none;text-align:center;max-width:86vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
@media (max-aspect-ratio:1/1){
 #card{left:50%;top:auto;bottom:2vh;width:92vw;transform:translate(-50%,30px);max-height:52vh}
 #card.on{transform:translate(-50%,0)}
 .chap{width:44vw}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vig"></div><div class="grain"></div>
<div id="brand"><b>ABANDONED BUT NOT FORGOTTEN</b><span>NASA'S HARDWARE LEFT BEHIND &mdash; STORIES FROM THE MOON, MARS &amp; BEYOND</span></div>
<button id="vr" title="WebXR mode">VR</button>
<div id="hint" class="mono"><i></i>CHOOSE A ROCKET TO START A MISSION</div>
<div id="labels"></div>
<div id="hud">
  <div id="mtitle" class="mono"><span id="mt1"></span><b id="mt2"></b></div>
  <div id="chaps"></div>
  <div id="speedhint">SCROLL TO GO FASTER</div>
  <div id="prog"><div class="row"><span id="p1"></span><span id="p2"></span></div><div class="bar"><div class="fill" id="pf"></div></div><div class="row"><span>DISTANCE REMAINING</span><b id="pd"></b></div></div>
  <button id="skip">SKIP TO ARRIVAL &raquo;</button>
</div>
<div id="card"></div>
<div id="toast"></div>
<div id="flash"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(typeof THREE==='undefined'){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff">Could not load Three.js.</p>');return;}

/* ---------------- DATA ---------------- */
const MISSIONS=[
{id:'eagle',name:'APOLLO 11 EAGLE',dest:'The Moon',hex:'#e8bd4a',col:0xe8bd4a,planet:'moon',distKm:384400,distLabel:'EARTH → MOON',
 tint:[[.10,.14,.30],[.35,.25,.10]],
 chapters:[
  ['July 16, 1969','Liftoff','A Saturn V rocket, taller than the Statue of Liberty, lifts three astronauts off from Florida.'],
  ['Two ships in one','Columbia & Eagle','Columbia stays in lunar orbit with Michael Collins. Eagle carries Neil Armstrong and Buzz Aldrin down to the surface.'],
  ['Built for the vacuum','Light as a feather','Eagle never had to fly through air, so engineers made it as light as possible. It only had to work on the Moon.'],
  ['The descent','About 12 minutes','Armstrong took manual control to avoid boulders. Eagle touched down with less than 30 seconds of fuel left.'],
  ['July 20, 1969','Tranquility Base','Armstrong and Aldrin spent about 2.5 hours walking outside, setting up experiments and collecting rocks.']
 ],
 card:{tag:'APOLLO 11 · LUNAR MODULE',place:'Sea of Tranquility, the Moon',status:['RESTING','ghost'],
  facts:[['Landed','July 20, 1969'],['Left behind','Descent stage, flag, instruments, a plaque'],['Outside time','About 2.5 hours'],['Crew','Armstrong, Aldrin (Collins stayed in orbit)']],
  sci:'The astronauts left a seismometer and a laser mirror. Scientists still bounce lasers off mirrors left by Apollo missions to measure the Moon’s distance. It drifts away about 3.8 cm every year.',
  fun:'The plaque on Eagle’s leg says: “We came in peace for all mankind.”'}},
{id:'sojourner',name:'SOJOURNER',dest:'Mars · Ares Vallis',hex:'#ff8a4d',col:0xff8a4d,planet:'mars',distKm:225e6,distLabel:'EARTH → MARS (AVERAGE)',
 tint:[[.30,.10,.05],[.12,.10,.28]],
 chapters:[
  ['Dec 4, 1996','Mars Pathfinder launches','A small, low-cost spacecraft with a tiny rover inside begins a seven-month trip to Mars.'],
  ['Cheaper, faster','A new way to explore','Pathfinder was built to prove NASA could reach Mars with a smaller budget and a shorter schedule.'],
  ['July 4, 1997','Bounce!','After a parachute and rockets, giant airbags let it bounce across Mars like a beach ball before it stopped.'],
  ['Meet Sojourner','Rover the size of a microwave','Six wheels, 10.5 kg. Its name came from a student contest won by 12-year-old Valerie Ambroise.'],
  ['Rock stars','Reading rocks','Its spectrometer measured rock chemistry. Scientists nicknamed rocks Barnacle Bill, Yogi and Scooby-Doo.'],
  ['The silence','Sept 27, 1997','Pathfinder sent its last signal. Sojourner worked 83 sols, about 12 times longer than planned.']
 ],
 card:{tag:'MARS PATHFINDER · ROVER',place:'Ares Vallis, Mars',status:['SILENT','ghost'],
  facts:[['Landed','July 4, 1997'],['Planned','7 sols (about a week)'],['Actual','83 sols'],['Distance','100+ m in total, never more than ~12 m from the lander']],
  sci:'Its X-ray spectrometer measured what rocks are made of. Pathfinder’s photos showed rounded pebbles shaped by flowing water, a clue that Mars was once much wetter.',
  fun:'It proved that a small rover could drive around Mars and do real science. That idea led to Spirit, Opportunity and Curiosity.'}},
{id:'opportunity',name:'OPPORTUNITY',dest:'Mars · Meridiani Planum',hex:'#ff5e45',col:0xff5e45,planet:'mars',distKm:225e6,distLabel:'EARTH → MARS (AVERAGE)',
 tint:[[.28,.07,.05],[.10,.14,.30]],
 chapters:[
  ['July 7, 2003','Launch','Opportunity leaves Earth on a Delta II rocket. Its twin, Spirit, launched a month earlier.'],
  ['A 90-day warranty','Planned: 90 sols','Engineers hoped the rover would survive three months. Dust, cold and failures were all expected to end it.'],
  ['Jan 25, 2004','A hole-in-one','Opportunity landed inside a small crater on Meridiani Planum, with rock layers in plain view.'],
  ['Blueberries','Clues in the dust','It found tiny hematite spheres and layered rocks, minerals that form in water. Mars had once been wet.'],
  ['Endless road','45.16 km','It drove farther than a marathon, the longest drive by any vehicle on another world.'],
  ['June 10, 2018','The great dust storm','A planet-wide storm blocked the Sun. After 14 years, its last signal came in.']
 ],
 card:{tag:'MARS EXPLORATION ROVER',place:'Meridiani Planum, Mars',status:['SILENT','ghost'],
  facts:[['Landed','Jan 25, 2004 (UTC)'],['Planned','90 sols'],['Actual','5,111 sols (about 14 years)'],['Distance','45.16 km'],['Last signal','June 10, 2018']],
  sci:'Opportunity found hematite “blueberries” and salty, layered rocks that showed liquid water once soaked this part of Mars.',
  fun:'NASA sent more than a thousand recovery commands before declaring the mission complete on Feb 13, 2019.'}},
{id:'ingenuity',name:'INGENUITY',dest:'Mars · Jezero Crater',hex:'#5ec8ff',col:0x5ec8ff,planet:'mars',distKm:225e6,distLabel:'EARTH → MARS (AVERAGE)',
 tint:[[.05,.18,.30],[.28,.10,.06]],
 chapters:[
  ['July 30, 2020','A helicopter hitches a ride','Ingenuity launches strapped under the belly of the Perseverance rover.'],
  ['Feb 18, 2021','Jezero Crater','Perseverance lands and carries Ingenuity to an airfield named Wright Brothers Field.'],
  ['Thin air','1% as dense as Earth’s','Mars’s air is so thin that Ingenuity’s blades had to spin around 2,400 times a minute.'],
  ['April 19, 2021','First flight','It rose 3 m for about 39 seconds. It was the first powered, controlled flight on another planet.'],
  ['Beyond the plan','5 flights became 72','Ingenuity became a scout for Perseverance and flew over 2 hours in total.'],
  ['Jan 18, 2024','Flight 72','A rotor blade was damaged on landing. Ingenuity could fly no more.']
 ],
 card:{tag:'MARS HELICOPTER',place:'Jezero Crater, Mars',status:['GROUNDED','ghost'],
  facts:[['First flight','April 19, 2021'],['Planned','5 flights'],['Actual','72 flights'],['Mass','1.8 kg (4 lb)'],['Last flight','Jan 18, 2024']],
  sci:'Ingenuity proved aircraft can fly on Mars. Future missions can use flying scouts to reach cliffs, caves and places a rover can’t drive.',
  fun:'It carries a tiny piece of fabric from the wing of the Wright brothers’ 1903 airplane.'}},
{id:'voyager',name:'VOYAGER 1',dest:'Interstellar space',hex:'#b794ff',col:0xb794ff,planet:'deep',distKm:25.9e9,distLabel:'EARTH → ONE LIGHT-DAY',
 tint:[[.14,.06,.30],[.04,.16,.28]],
 chapters:[
  ['Sept 5, 1977','Launch','Voyager 1 lifts off from Florida. Its twin, Voyager 2, had launched two weeks earlier.'],
  ['A rare alignment','The Grand Tour','The outer planets lined up in a way that happens about once every 175 years. Gravity could slingshot the probes.'],
  ['1979 – 1980','Jupiter and Saturn','Voyager 1 sent back the first close-up views of Jupiter’s moons and Saturn’s rings. It flew by Saturn in Nov 1980.'],
  ['Feb 14, 1990','Pale Blue Dot','From about 6 billion km away, it turned its camera back and photographed Earth as a tiny dot.'],
  ['The Golden Record','A message in a bottle','It carries sounds and images of Earth on a gold-plated disc, in case anyone ever finds it.'],
  ['2012','Leaving the bubble','Voyager 1 crossed the heliopause, the edge of the Sun’s influence, and entered interstellar space.'],
  ['Nov 18, 2026','One light-day','A radio message now takes about a day to reach it. It will be the first human-made object this far away.']
 ],
 card:{tag:'DEEP SPACE PROBE',place:'Interstellar space, 25.9 billion km from Earth',status:['STILL TALKING','live'],
  facts:[['Launched','Sept 5, 1977'],['Speed','About 17 km/s (11 mi/s)'],['Signal time','About 24 hours one way'],['Power','Expected to last into the early 2030s']],
  sci:'Voyager 1 explored Jupiter and Saturn, then crossed the heliopause in 2012. It is one of the only two spacecraft that have ever operated outside the Sun’s bubble.',
  fun:'It isn’t abandoned at all. It is the one hardware story here that is still being told, one day at a time.'}}
];

/* ---------------- BASICS ---------------- */
const $=id=>document.getElementById(id);
const cv=$('gl');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,.1,2500);
const camPos=new THREE.Vector3(0,0,14), camLook=new THREE.Vector3(0,0,0);
const clock=new THREE.Clock();
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeO=t=>1-Math.pow(1-t,3);
const tweens=[];
function tween(dur,fn,done,ease){tweens.push({t:0,dur:dur,fn:fn,done:done,ease:ease||easeIO});}
function wait(s,f){tween(s,function(){},f);}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('on'),3800);}

/* ---------------- LIGHTS ---------------- */
scene.add(new THREE.HemisphereLight(0x8fb0ff,0x1a1020,.55));
const key=new THREE.DirectionalLight(0xfff0dd,2.4);key.position.set(-6,8,10);scene.add(key);
const rim=new THREE.DirectionalLight(0x6a8cff,1.4);rim.position.set(8,-2,-6);scene.add(rim);

/* ---------------- GLSL ---------------- */
const NOISE=`
float h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
`;

/* nebula background */
const nebMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
 uniforms:{uTime:{value:0},uA:{value:new THREE.Color(.10,.14,.30)},uB:{value:new THREE.Color(.35,.12,.30)},uI:{value:1}},
 vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`varying vec3 vD;uniform float uTime,uI;uniform vec3 uA,uB;${NOISE}
 void main(){vec3 d=vD*1.7;float n=fbm(d+vec3(0.,uTime*.006,0.));float m=fbm(d*2.4-n*1.2+uTime*.004);
  float neb=smoothstep(.38,.92,n*m*2.3);vec3 col=vec3(.004,.006,.016)+mix(uA,uB,m)*neb*.85*uI;
  col+=vec3(.02,.03,.06)*pow(1.-abs(vD.y),6.)*uI;gl_FragColor=vec4(col,1.);}`});
const neb=new THREE.Mesh(new THREE.SphereGeometry(1800,48,32),nebMat);neb.renderOrder=-10;scene.add(neb);

/* background stars */
(function(){
 const N=5000,pos=new Float32Array(N*3),sz=new Float32Array(N),ph=new Float32Array(N),col=new Float32Array(N*3);
 for(let i=0;i<N;i++){
  const u=Math.random()*2-1,a=Math.random()*6.2832,r=Math.sqrt(1-u*u),R=900+Math.random()*600;
  pos[i*3]=r*Math.cos(a)*R;pos[i*3+1]=u*R;pos[i*3+2]=r*Math.sin(a)*R;
  sz[i]=Math.pow(Math.random(),4)*3.2+.8;ph[i]=Math.random()*6.28;
  const t=Math.random(),c=t<.6?[.8,.88,1]:t<.85?[1,.95,.85]:[1,.75,.65];
  col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2];
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 g.setAttribute('aS',new THREE.BufferAttribute(sz,1));
 g.setAttribute('aP',new THREE.BufferAttribute(ph,1));
 g.setAttribute('aC',new THREE.BufferAttribute(col,3));
 const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uPR:{value:renderer.getPixelRatio()}},
  vertexShader:`attribute float aS,aP;attribute vec3 aC;uniform float uTime,uPR;varying vec3 vC;varying float vT;
   void main(){vC=aC;vT=.65+.35*sin(uTime*(.8+aP*.3)+aP*9.);gl_PointSize=aS*uPR*vT;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vC;varying float vT;void main(){float d=length(gl_PointCoord-.5)*2.;float a=smoothstep(1.,0.,d);a*=a;gl_FragColor=vec4(vC*1.3,a*vT);}`});
 const p=new THREE.Points(g,m);p.frustumCulled=false;scene.add(p);
 scene.userData.stars=p;
})();

/* warp lines */
const warp=(function(){
 const N=2200,pos=new Float32Array(N*6),end=new Float32Array(N*2),seed=new Float32Array(N*2);
 for(let i=0;i<N;i++){
  const a=Math.random()*6.2832,r=2.4+Math.pow(Math.random(),.7)*48,x=Math.cos(a)*r,y=Math.sin(a)*r,z=Math.random()*310-300,s=Math.random();
  for(let k=0;k<2;k++){const j=i*2+k;pos[j*3]=x;pos[j*3+1]=y;pos[j*3+2]=z;end[j]=k;seed[j]=s;}
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 g.setAttribute('aEnd',new THREE.BufferAttribute(end,1));
 g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
 const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uTravel:{value:0},uLen:{value:.3},uOp:{value:0},uTint:{value:new THREE.Color(.6,.75,1)}},
  vertexShader:`attribute float aEnd,aSeed;uniform float uTravel,uLen,uOp;varying float vA;varying vec3 vC;uniform vec3 uTint;
   void main(){float z=mod(position.z+uTravel,310.)-300.;z-=aEnd*uLen;

  uniforms:{c1:{value:new THREE.Color().setRGB(...cfg.c1)},c2:{value:new THREE.Color().setRGB(...cfg.c2)},c3:{value:new THREE.Color().setRGB(...cfg.c3)},atm:{value:new THREE.Color().setRGB(...cfg.atm)},cr:{value:cfg.cr},uL:{value:new THREE.Vector3(-.5,.55,.65).normalize()}},
  vertexShader:`varying vec3 vN;varying vec3 vO;void main(){vN=normalize(normalMatrix*normal);vO=normal;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vN;varying vec3 vO;uniform vec3 c1,c2,c3,atm,uL;uniform float cr;${NOISE}
  void main(){float n=fbm(vO*5.),n2=fbm(vO*18.+3.);vec3 col=mix(c1,c2,smoothstep(.3,.75,n));col=mix(col,c3,smoothstep(.55,.85,n2)*.7);
   float c=1.-abs(2.*vn(vO*22.)-1.);c=smoothstep(.82,.98,c);col*=1.-c*.45*cr;col+=c*.12*cr*(1.+fbm(vO*60.));
   float fine=fbm(vO*90.);col*=.85+.3*fine;
   vec3 N=normalize(vN);float d=max(dot(N,uL),0.);col*=.05+d*1.25;
   float fr=pow(1.-max(N.z,0.),3.);col+=atm*fr*(.15+.9*d);gl_FragColor=vec4(col,1.);}`});

 tween(4.2,t=>{
  camPos.lerpVectors(cp0,cpT,t);camLook.lerpVectors(cl0,clT,t);
  r.position.z=rp0.z-t*60;r.scale.setScalar(1.15*(1-easeO(t)*.9));
  if(pl){const R=portrait?16:22;pl.scale.setScalar(R);pl.position.set(0,-R-3.2+ (1-easeO(t))*-18,-14);}
 },()=>{
  r.visible=false;
  model=BUILD[m.id]();const sz=model.userData.size||2.5;const sc=(portrait?3.0:4.0)/sz;
  model.position.set(portrait?0:3.4,portrait?2.2:.5,0);model.scale.setScalar(.001);model.userData.sc=sc;scene.add(model);
  tween(1.6,k=>{model.scale.setScalar(sc*easeO(k));},()=>{phase='landed';});
  showCard(m);
 });
 $('flash').style.transition='none';
}

function back(){
 const m=MISSIONS[sel];if(!m)return;
 $('card').classList.remove('on');$('hud').classList.remove('on');phase='return';
 if(model){const mo=model,s0=mo.scale.x;tween(.8,k=>{mo.scale.setScalar(Math.max(.001,s0*(1-k)));},()=>{scene.remove(mo);});model=null;}
 const r=rockets[sel];const cp0=camPos.clone(),cl0=camLook.clone();
 const pl=planet[m.planet];
 tween(1.4,k=>{if(pl)pl.position.y-=.3;camPos.lerpVectors(cp0,V(0,0,14),k);camLook.lerpVectors(cl0,V(0,0,0),k);},()=>{
  if(pl)pl.visible=false;sunSprite.visible=false;
  r.visible=true;r.position.copy(r.userData.home);r.rotation.set(0,r.userData.homeRot,0);r.scale.setScalar(0.001);r.userData.thrustT=.35;
  rockets.forEach(o=>{o.visible=true;o.position.copy(o.userData.home);o.rotation.set(0,o.userData.homeRot,0);const hs=o.userData.homeScale;const s0=o.scale.x<.01?0:o.scale.x;tween(1,k=>{o.scale.setScalar(hs*k);});});
  setTint(null);sel=-1;phase='hangar';$('hint').style.opacity=1;$('brand').style.opacity=1;labels.forEach(l=>l.style.opacity=1);
 });
}

/* ---------------- LOOP ---------------- */
layout();
rockets.forEach(r=>{r.position.copy(r.userData.home);r.scale.setScalar(r.userData.homeScale);r.rotation.y=r.userData.homeRot;});
// intro: rockets rise in
rockets.forEach((r,i)=>{r.scale.setScalar(.001);wait(.4+i*.18,()=>{const hs=r.userData.homeScale;tween(1.2,k=>{r.scale.setScalar(Math.max(.001,hs*k));},null,easeO);});});

const tmp=V(0,0,0),sunDirBase=V(0,0,0);
function frame(){
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=Math.min(1,w.t/w.dur);w.fn(w.ease(k));if(k>=1){tweens.splice(i,1);if(w.done)w.done();}}
 nebMat.uniforms.uTime.value=t;scene.userData.stars.material.uniforms.uTime.value=t;
 scene.userData.stars.rotation.y=t*.002;neb.rotation.y=t*.0015;

 // hangar behaviour
 let hov=-1;if(phase==='hangar'){hov=pick();cv.style.cursor=hov>=0?'pointer':'default';}else cv.style.cursor='default';
 rockets.forEach((r,i)=>{
  const u=r.userData;
  if(phase==='hangar'){
   u.hover+=((i===hov?1:0)-u.hover)*Math.min(1,dt*8);
   r.position.y=u.home.y+Math.sin(t*1.1+i*1.7)*.18+u.hover*.25;r.position.x=u.home.x;r.position.z=u.home.z;
   r.rotation.set(0,u.homeRot+Math.sin(t*.5+i)*.35+t*.15*u.hover,Math.sin(t*.9+i)*.03);
   if(r.scale.x>.05)r.scale.setScalar(u.homeScale*(1+u.hover*.1));
   u.thrustT=.35+u.hover*.6;
   labels[i].classList.toggle('hot',i===hov);
   tmp.copy(u.home);tmp.y-=2.2*u.homeScale;tmp.project(camera);
   labels[i].style.left=((tmp.x*.5+.5)*innerWidth)+'px';labels[i].style.top=((-tmp.y*.5+.5)*innerHeight)+'px';
  }
  u.thrust+=(u.thrustT-u.thrust)*Math.min(1,dt*4);
  const f=u.thrust*(1+.12*Math.sin(t*38+i*2)+.08*Math.sin(t*61));
  u.flame.scale.set(.8+f*.35,Math.max(.01,f),.8+f*.35);u.glow.material.opacity=Math.min(1,.35+u.thrust*.45);
 });

 // cruise
 if(phase==='cruise'){
  boost*=Math.exp(-dt*.9);
  progress+=dt/46*(1+boost);
  spdTarget=.55+Math.min(.4,boost*.08);
  if(progress>=1){progress=1;arrive();}
  const m=MISSIONS[sel];$('pf').style.width=(progress*100)+'%';$('pd').textContent=fmtDist(m.distKm*(1-progress));$('p2').textContent=Math.round(progress*100)+'%';
  const chs=document.querySelectorAll('.chap'),n=chs.length;
  chs.forEach((c,i)=>{const a=.02+i*(.9/n),on=progress>=a&&progress<a+.9/n*1.05;c.classList.toggle('on',on);});
  $('speedhint').style.opacity=boost>.2?0:1;
  const r=rockets[sel];r.position.x=Math.sin(t*.45)*.18;r.position.y=Math.sin(t*.7)*.1;r.rotation.z=Math.sin(t*.5)*.05;
  camPos.x+=(r.position.x*.6-camPos.x)*Math.min(1,dt*2);
 }
 spd+=(spdTarget-spd)*Math.min(1,dt*(phase==='arrive'?1.1:2));
 if(phase==='cruise'||phase==='launch'||phase==='arrive'){}
 travelAcc+=spd*160*dt;
 const wu=warp.material.uniforms;wu.uTravel.value=travelAcc;wu.uLen.value=.3+spd*spd*30;wu.uOp.value=Math.min(1,spd*3);warp.visible=spd>.01;
 if(phase==='cruise'||phase==='launch'){rockets[sel].userData.thrustT=.9+spd*1.1;}

 // arrival visuals
 if(model){model.rotation.y+=dt*.35;if(model.userData.spin){model.userData.spin[0].rotation.y+=dt*14;model.userData.spin[1].rotation.y-=dt*14;}
  model.position.y+=(Math.sin(t*.8)*.002);}
 if(sunSprite.visible){const s=40+Math.sin(t*1.3)*2;sunSprite.scale.set(s,s,1);}

 // camera
 par.lerp(parT,Math.min(1,dt*2));
 const shake=phase==='cruise'||phase==='launch'?spd*.012:0;
 camera.position.copy(camPos);
 if(phase==='hangar'){camera.position.x+=par.x*.9;camera.position.y+=par.y*.5;}
 camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;
 camera.lookAt(camLook);
 if(phase==='cruise')camera.rotateZ(Math.sin(t*.35)*.02);
 renderer.render(scene,camera);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script></body></html>
